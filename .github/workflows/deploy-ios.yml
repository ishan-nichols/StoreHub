name: Deploy iOS → App Store

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane to run"
        required: true
        default: beta
        type: choice
        options:
          - beta      # build + upload to TestFlight
          - deploy    # submit latest TestFlight build to App Store review

# ── How to activate ────────────────────────────────────────────────────────────
# 1. Create an App Store Connect API key (App Store Connect → Users → Keys):
#      - Role: App Manager (or Developer for TestFlight only)
#      - Download the .p8 file — you can only download it once
# 2. Base64-encode the .p8 key:
#      base64 -i AuthKey_XXXXXXXXXX.p8 | tr -d '\n'
# 3. Set up Fastlane Match (code signing via encrypted Git repo):
#      - Create a private repo (e.g. github.com/your-org/storehub-certs)
#      - Run locally once: bundle exec fastlane match init
#      - Then: bundle exec fastlane match appstore
# 4. Add these GitHub repository secrets (Settings → Secrets → Actions):
#      APPLE_ID                        your Apple ID email
#      APPLE_TEAM_ID                   your 10-char Team ID (developer.apple.com)
#      APP_STORE_CONNECT_TEAM_ID       numeric team ID from App Store Connect
#      APP_STORE_CONNECT_API_KEY_ID    10-char key ID (e.g. XXXXXXXXXX)
#      APP_STORE_CONNECT_API_ISSUER_ID UUID from App Store Connect → Keys page
#      APP_STORE_CONNECT_API_KEY_CONTENT  base64-encoded .p8 content from step 2
#      MATCH_GIT_URL                   https://github.com/your-org/storehub-certs.git
#      MATCH_PASSWORD                  passphrase you chose when running match init
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    name: Build & upload to App Store (${{ github.event.inputs.lane }})
    runs-on: macos-15   # Xcode 16 — required for iOS builds

    defaults:
      run:
        working-directory: artifacts/storehub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build web app
        run: pnpm run build

      - name: Sync Capacitor → iOS
        run: npx cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: artifacts/storehub

      - name: Run Fastlane
        run: bundle exec fastlane ios ${{ github.event.inputs.lane }}
        env:
          APPLE_ID:                          ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:                     ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID:         ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID:      ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL:                     ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:                    ${{ secrets.MATCH_PASSWORD }}
          GITHUB_RUN_NUMBER:                 ${{ github.run_number }}
