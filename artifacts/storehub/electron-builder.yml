# electron-builder configuration — Windows installer (.exe)
# Docs: https://www.electron.build/configuration/configuration

appId: com.storehub.app
productName: StoreHub POS
copyright: Copyright © 2025 StoreHub

# The Electron main process is bundled by esbuild (see build:electron script)
# into electron/main.bundle.cjs — all deps inlined, no node_modules needed.
# The web app is pre-built into dist/public/ by Vite.
files:
  - electron/main.bundle.cjs
  - electron/preload.cjs
  - electron/kiosk-pin.html
  - "electron/assets/**/*"
  - dist/public/**/*
  - package.json
  - "!node_modules/**/*"

# Skip native module rebuild — no native addons
npmRebuild: false
# Suppress npm peer-dep errors from monorepo packages (Capacitor etc) that
# electron-builder scans but are not part of the Electron runtime bundle.
npmArgs:
  - --legacy-peer-deps

# Entry point is the esbuild bundle — all deps inlined except 'electron' itself
extraMetadata:
  main: electron/main.bundle.cjs

# ── Windows ───────────────────────────────────────────────────────────────────

win:
  target:
    - target: zip      # works on Linux — portable zip, extract and run
      arch: [x64]
    - target: nsis     # full installer .exe — requires Wine on Linux; use windows-latest CI
      arch: [x64]
  # icon: electron/assets/icon.ico   # uncomment once you add a 256×256 .ico file

nsis:
  oneClick:              false
  allowToChangeInstallationDirectory: true
  perMachine:            false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish:        true

# ── Auto-updater (GitHub Releases) ───────────────────────────────────────────
# Add GH_TOKEN secret in GitHub Actions → run build:electron:publish to publish.

publish:
  provider:    github
  owner:       ishan-nichols
  repo:        StoreHub
  releaseType: release

# ── Build output ─────────────────────────────────────────────────────────────

directories:
  output:          dist/electron-dist
  buildResources:  electron/assets
